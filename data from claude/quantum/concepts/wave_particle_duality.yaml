id: wave_particle_duality
name: Wave-Particle Duality
category: Concept
definition: >
  The principle that quantum entities such as photons and electrons exhibit both wave-like
  behavior (interference, diffraction) and particle-like behavior (discrete, localized
  detection) depending on how they are observed.

explained_by:
  - wave_equation
used_in:
  - double_slit
related_concepts:
  - superposition
  - interference
