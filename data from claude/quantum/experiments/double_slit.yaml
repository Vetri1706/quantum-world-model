id: QEXP002
name: Young's Double Slit Experiment
category: Quantum Mechanics
difficulty: Beginner
interactive: true

scientific_question: Does light (and matter) behave as a wave, a particle, or both?
goal: Understand wave-particle duality and how interference arises from a single particle's own wave nature.

history:
  scientist: "Thomas Young"
  year: 1801
  significance: >
    Originally performed to settle whether light was a wave or a particle - the resulting
    interference pattern demonstrated light's wave nature and directly inspired the later
    development of quantum mechanics. The experiment's deeper strangeness (a single
    particle interfering with itself) was only appreciated once quantum theory matured.

environment: earth_laboratory

required_equipment:
  - laser
  - double_slit_plate
  - projection_screen

optional_equipment:
  - photon_detector

required_elements:
  - photon_source
  - double_slit
  - screen

variables:
  wavelength: { min: 380, max: 700, default: 532, unit: nm }
  slit_separation: { min: 0.01, max: 1.0, default: 0.1, unit: mm }
  screen_distance: { min: 0.1, max: 5.0, default: 1.0, unit: m }

procedure:
  - Place the laser (photon source)
  - Place the double slit plate in front of it
  - Place the projection screen behind the slits
  - Run the experiment and observe the pattern on the screen

expected_observation: >
  An alternating pattern of bright and dark fringes appears on the screen, rather than
  two simple bright bands directly behind the slits. This pattern persists even when
  particles are sent through one at a time, showing that each particle interferes with
  itself.

common_mistakes:
  - photon_goes_through_one_slit_misconception
  - fringes_are_just_shadows_misconception

related_concepts:
  - wave_particle_duality
  - superposition
  - interference

equations:
  - wave_equation
  - double_slit_fringe_spacing

references:
  - feynman_lectures_vol3
  - hyperphysics_double_slit

metadata:
  education_level: Undergraduate
  estimated_time: "15 min"
  requires_math: false
  math_level: "Trigonometry"
  simulation_type: 2D
  render_mode: wave
  engine: double_slit_interference_pattern
