<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Quantum Lab — Playground Mockup</title>
<style>
  :root {
    --bg: #070b14;
    --panel: #0d1220;
    --panel-2: #10182b;
    --border: rgba(255,255,255,0.08);
    --border-strong: rgba(255,255,255,0.14);
    --text: #e8ecf5;
    --text-dim: #8b94ac;
    --text-faint: #565f78;
    --blue: #4fd1ff;
    --purple: #b98bff;
    --green: #6ee7b7;
    --blue-glow: rgba(79, 209, 255, 0.35);
    --purple-glow: rgba(185, 139, 255, 0.35);
    --green-glow: rgba(110, 231, 183, 0.35);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
  }
  .app {
    display: flex;
    flex-direction: column;
    height: 900px;
    border-radius: 14px;
    overflow: hidden;
    border: 1px solid var(--border);
  }
  .topbar {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 14px 20px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
  }
  .back {
    color: var(--text-dim);
    font-size: 14px;
    cursor: pointer;
  }
  .title-block { display: flex; flex-direction: column; gap: 2px; }
  .title-block h1 { font-size: 15px; font-weight: 600; margin: 0; }
  .title-block p { font-size: 12px; color: var(--text-dim); margin: 0; }
  .status-badge {
    margin-left: auto;
    font-size: 12px;
    font-weight: 600;
    padding: 6px 12px;
    border-radius: 999px;
    background: rgba(139,148,172,0.12);
    color: var(--text-dim);
    border: 1px solid var(--border-strong);
    transition: all 0.2s;
  }
  .status-badge.complete {
    background: rgba(110,231,183,0.12);
    color: var(--green);
    border-color: rgba(110,231,183,0.35);
  }
  .legend {
    display: flex;
    align-items: center;
    gap: 18px;
    padding: 10px 20px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    font-size: 12px;
    color: var(--text-dim);
  }
  .legend b { color: var(--text); font-weight: 600; margin-right: 4px; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
  .dot.blue { background: var(--blue); box-shadow: 0 0 6px var(--blue-glow); }
  .dot.purple { background: var(--purple); box-shadow: 0 0 6px var(--purple-glow); }
  .dot.green { background: var(--green); box-shadow: 0 0 6px var(--green-glow); }

  .body { display: flex; flex: 1; min-height: 0; }

  .panel {
    padding: 18px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    overflow-y: auto;
  }
  .panel.left { width: 240px; background: var(--panel); border-right: 1px solid var(--border); }
  .panel.right { width: 300px; background: var(--panel); border-left: 1px solid var(--border); }
  .panel-heading { font-size: 11px; font-weight: 700; letter-spacing: 0.06em; color: var(--text-faint); text-transform: uppercase; margin-bottom: 2px; }
  .panel-sub { font-size: 12px; color: var(--text-dim); margin: -6px 0 6px; }

  .equip-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--panel-2);
    cursor: pointer;
    transition: all 0.15s;
  }
  .equip-row.on.blue { border-color: rgba(79,209,255,0.4); box-shadow: 0 0 0 1px rgba(79,209,255,0.15) inset; }
  .equip-row.on.purple { border-color: rgba(185,139,255,0.4); box-shadow: 0 0 0 1px rgba(185,139,255,0.15) inset; }
  .equip-row.on.green { border-color: rgba(110,231,183,0.4); box-shadow: 0 0 0 1px rgba(110,231,183,0.15) inset; }
  .equip-row .name { font-size: 13px; font-weight: 500; flex: 1; }
  .equip-row .role { font-size: 10px; color: var(--text-faint); text-transform: uppercase; letter-spacing: 0.04em; }
  .toggle {
    width: 34px; height: 20px; border-radius: 999px; background: rgba(255,255,255,0.08);
    position: relative; flex-shrink: 0; transition: background 0.2s;
  }
  .toggle.on { background: rgba(110,231,183,0.5); }
  .toggle::after {
    content: ''; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px;
    border-radius: 50%; background: #e8ecf5; transition: left 0.2s;
  }
  .toggle.on::after { left: 16px; }

  .stage {
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 18px;
    gap: 12px;
    background: radial-gradient(ellipse at 50% 30%, #0e1526 0%, #070b14 70%);
  }
  .stat-card {
    align-self: flex-start;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 16px;
  }
  .stat-card .label { font-size: 11px; color: var(--text-dim); }
  .stat-card .value { font-size: 22px; font-weight: 700; color: var(--blue); margin-top: 2px; }
  .canvas {
    flex: 1;
    border-radius: 12px;
    border: 1px dashed var(--border-strong);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    background:
      linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px) 0 0 / 40px 40px,
      linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px) 0 0 / 40px 40px;
  }
  .empty-hint { font-size: 13px; color: var(--text-faint); text-align: center; max-width: 260px; }
  .empty-hint .arrow { display: block; margin-top: 6px; font-size: 20px; color: var(--text-faint); }

  .obj-row { display: flex; align-items: center; gap: 40px; }
  .node { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .node .label { font-size: 12px; font-weight: 600; }
  .orb {
    width: 46px; height: 46px; border-radius: 50%;
  }
  .orb.blue { background: radial-gradient(circle at 35% 30%, #bdeeff, var(--blue)); box-shadow: 0 0 24px var(--blue-glow); }
  .barrier {
    width: 20px; height: 70px; border-radius: 4px;
    background: linear-gradient(180deg, #d9baff, var(--purple));
    box-shadow: 0 0 24px var(--purple-glow);
  }
  .detector {
    width: 46px; height: 70px; border-radius: 6px;
    background: linear-gradient(180deg, #c7f7e2, var(--green));
    box-shadow: 0 0 24px var(--green-glow);
  }
  .link-line { width: 46px; height: 2px; background: linear-gradient(90deg, var(--blue), var(--purple)); opacity: 0.5; }
  .link-line.right { background: linear-gradient(90deg, var(--purple), var(--green)); }

  .slider-block { display: flex; flex-direction: column; gap: 4px; }
  .slider-block .head { display: flex; justify-content: space-between; font-size: 12px; }
  .slider-block .head span:last-child { color: var(--text-dim); font-variant-numeric: tabular-nums; }
  .slider-block input[type=range] { width: 100%; accent-color: var(--blue); }
  .slider-block.locked { opacity: 0.4; pointer-events: none; }
  .slider-block.locked .head span:last-child { color: var(--text-faint); }

  .btn {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    padding: 10px 14px; border-radius: 10px; font-size: 13px; font-weight: 600;
    border: 1px solid var(--border-strong); cursor: pointer; transition: all 0.15s;
  }
  .btn.primary { background: linear-gradient(135deg, #2fb8e8, #4fd1ff); color: #06202b; border: none; }
  .btn.primary:hover { filter: brightness(1.08); }
  .btn.ghost { background: var(--panel-2); color: var(--text); }
  .btn.ghost:hover { border-color: var(--border-strong); background: rgba(255,255,255,0.04); }
  .btn.disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-row { display: flex; gap: 10px; }

  .mentor-btn {
    display: flex; align-items: center; gap: 8px; padding: 10px 14px;
    border-radius: 10px; border: 1px solid var(--border-strong);
    background: var(--panel-2); font-size: 13px; font-weight: 500; cursor: pointer;
  }
  .mentor-btn .avatar {
    width: 20px; height: 20px; border-radius: 50%;
    background: linear-gradient(135deg, var(--purple), var(--blue));
    flex-shrink: 0;
  }
  .mentor-hint { font-size: 11px; color: var(--text-faint); line-height: 1.5; }

  .divider { height: 1px; background: var(--border); margin: 2px 0; }

  .toggle-view { display: flex; gap: 8px; margin: 16px 0 0 0; justify-content: center; }
  .view-btn {
    font-size: 12px; padding: 6px 14px; border-radius: 8px; border: 1px solid var(--border-strong);
    background: var(--panel-2); color: var(--text-dim); cursor: pointer;
  }
  .view-btn.active { background: var(--blue); color: #06202b; border-color: var(--blue); }
</style>
</head>
<body>

<div class="app" id="app"></div>
<div class="toggle-view">
  <button class="view-btn active" onclick="render('empty')">Empty state</button>
  <button class="view-btn" onclick="render('equipped')">Equipped + measuring</button>
</div>

<script>
const equipment = [
  { name: 'Electron Source', role: 'Source', color: 'blue' },
  { name: 'Potential Barrier', role: 'Barrier', color: 'purple' },
  { name: 'Particle Detector', role: 'Detector', color: 'green' }
];

function render(state) {
  document.querySelectorAll('.view-btn').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');

  const on = state === 'equipped';
  const app = document.getElementById('app');

  app.innerHTML = `
    <div class="topbar">
      <span class="back">&larr;</span>
      <div class="title-block">
        <h1>Quantum Tunneling &mdash; Playground</h1>
        <p>Goal: see how barrier width and energy change the chance an electron crosses</p>
      </div>
      <div class="status-badge ${on ? 'complete' : ''}">Equipment: ${on ? '3' : '0'} / 3 placed</div>
    </div>

    <div class="legend">
      <span><b>Legend</b></span>
      <span><span class="dot blue"></span>Source</span>
      <span><span class="dot purple"></span>Barrier</span>
      <span><span class="dot green"></span>Detector</span>
    </div>

    <div class="body">
      <div class="panel left">
        <div class="panel-heading">1. Equipment</div>
        <div class="panel-sub">Tap to place each piece on the stage</div>
        ${equipment.map(e => `
          <div class="equip-row ${on ? 'on ' + e.color : ''}">
            <div class="toggle ${on ? 'on' : ''}"></div>
            <div>
              <div class="name">${e.name}</div>
              <div class="role">${e.role}</div>
            </div>
          </div>
        `).join('')}
        ${on ? '<div class="mentor-hint">Tap any piece again to remove it.</div>' : ''}
      </div>

      <div class="stage">
        ${on ? `
          <div class="stat-card">
            <div class="label">Transmission probability</div>
            <div class="value">79.6%</div>
          </div>
        ` : ''}
        <div class="canvas">
          ${on ? `
            <div class="obj-row">
              <div class="node"><div class="orb blue"></div><div class="label" style="color:var(--blue)">Electron Source</div></div>
              <div class="link-line"></div>
              <div class="node"><div class="barrier"></div><div class="label" style="color:var(--purple)">Barrier (1.5 eV)</div></div>
              <div class="link-line right"></div>
              <div class="node"><div class="detector"></div><div class="label" style="color:var(--green)">Detector</div></div>
            </div>
          ` : `
            <div class="empty-hint">
              Place equipment from the left panel to begin
              <span class="arrow">&larr;</span>
            </div>
          `}
        </div>
      </div>

      <div class="panel right">
        <div class="panel-heading">2. Controls</div>
        ${!on ? '<div class="panel-sub">Unlock once the matching equipment is placed</div>' : ''}
        <div class="slider-block ${!on ? 'locked' : ''}">
          <div class="head"><span>Barrier height</span><span>${on ? '1.5 eV' : 'locked'}</span></div>
          <input type="range" ${!on ? 'disabled' : ''} value="50">
        </div>
        <div class="slider-block ${!on ? 'locked' : ''}">
          <div class="head"><span>Barrier width</span><span>${on ? '1 nm' : 'locked'}</span></div>
          <input type="range" ${!on ? 'disabled' : ''} value="30">
        </div>
        <div class="slider-block ${!on ? 'locked' : ''}">
          <div class="head"><span>Particle energy</span><span>${on ? '3.8 eV' : 'locked'}</span></div>
          <input type="range" ${!on ? 'disabled' : ''} value="65">
        </div>

        <div class="divider"></div>
        <div class="panel-heading">3. Run</div>
        <div class="btn-row">
          <div class="btn primary ${!on ? 'disabled' : ''}">${on ? '&#9654; Run' : 'Run (needs all equipment)'}</div>
          ${on ? '<div class="btn ghost">&#8635;</div>' : ''}
        </div>

        <div class="divider"></div>
        <div class="mentor-btn"><div class="avatar"></div>Ask mentor</div>
        <div class="mentor-hint">Stays quiet unless you ask, or try to run with something missing.</div>

        ${on ? '<div class="divider"></div><div class="btn primary">Complete &amp; view discoveries</div>' : ''}
      </div>
    </div>
  `;
}

render('empty');
</script>

</body>
</html>
