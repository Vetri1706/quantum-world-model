---
$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "qwm://schemas/component/1.0.0"
title: QWM Component
type: object
allOf:
  - $ref: "common.schema.yaml#/definitions/entityBase"
properties:
  name:
    type: string
    minLength: 1
  component_kind:
    enum: [equipment, element, source, detector, material]
  category:
    type: string
    minLength: 1
  properties:
    type: object
    additionalProperties:
      $ref: "common.schema.yaml#/definitions/conditionValue"
  compatible_with:
    type: array
    uniqueItems: true
    items:
      allOf:
        - $ref: "common.schema.yaml#/definitions/entityId"
        - x-foreign-key:
            entity_type: component
  renderer_asset:
    type: [string, "null"]
  evidence:
    $ref: "common.schema.yaml#/definitions/evidenceMap"
required: [name, component_kind, category, evidence]
unevaluatedProperties: false
