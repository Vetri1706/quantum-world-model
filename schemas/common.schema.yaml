---
$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "qwm://schemas/common/1.0.0"
title: QWM Common Definitions
definitions:
  entityId:
    type: string
    pattern: "^[a-z][a-z0-9-]{2,63}$"
  entityBase:
    type: object
    properties:
      id:
        $ref: "#/definitions/entityId"
      schema_version:
        type: string
        pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+$"
      status:
        enum: [draft, review, approved, deprecated]
      supersedes:
        $ref: "#/definitions/entityId"
      deprecated_by:
        $ref: "#/definitions/entityId"
    required: [id, schema_version, status]
  sourceLocator:
    type: string
    minLength: 1
  evidenceEntry:
    type: object
    properties:
      source:
        allOf:
          - $ref: "#/definitions/entityId"
          - x-foreign-key:
              entity_type: source
      locator:
        $ref: "#/definitions/sourceLocator"
      claim_type:
        enum: [definition, equation, procedure, observation, parameter, historical, classification]
    required: [source, locator, claim_type]
    additionalProperties: false
  evidenceMap:
    type: object
    minProperties: 1
    patternProperties:
      "^/(?:[^/~]|~[01])*$":
        type: array
        minItems: 1
        items:
          $ref: "#/definitions/evidenceEntry"
    additionalProperties: false
  quantity:
    type: object
    properties:
      value:
        type: [number, "null"]
      unit:
        type: string
        minLength: 1
    required: [value, unit]
    additionalProperties: false
  conditionValue:
    oneOf:
      - $ref: "#/definitions/quantity"
      - type: string
        minLength: 1
      - type: boolean
      - type: "null"
  parameterDefinition:
    type: object
    properties:
      id:
        $ref: "#/definitions/entityId"
      label:
        type: string
        minLength: 1
      quantity:
        type: string
        minLength: 1
      unit:
        type: string
        minLength: 1
      default:
        type: [number, string, boolean, "null"]
      minimum:
        type: [number, "null"]
      maximum:
        type: [number, "null"]
      allowed_values:
        type: array
        minItems: 1
        uniqueItems: true
        items:
          type: [number, string, boolean]
    required: [id, label, quantity, unit, default]
    additionalProperties: false
  predicate:
    type: object
    properties:
      subject:
        type: string
        minLength: 1
      operator:
        enum: [equals, not-equals, less-than, less-than-or-equal, greater-than, greater-than-or-equal, increases, decreases, present, absent]
      value:
        type: [number, string, boolean, "null"]
      unit:
        type: [string, "null"]
    required: [subject, operator]
    additionalProperties: false
  modelPort:
    type: object
    properties:
      id:
        $ref: "#/definitions/entityId"
      quantity:
        type: string
        minLength: 1
      unit:
        type: string
        minLength: 1
    required: [id, quantity, unit]
    additionalProperties: false
