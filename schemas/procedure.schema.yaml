---
$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "qwm://schemas/procedure/1.0.0"
title: QWM Procedure
type: object
allOf:
  - $ref: "common.schema.yaml#/definitions/entityBase"
properties:
  name:
    type: string
    minLength: 1
  steps:
    type: array
    minItems: 1
    items:
      type: object
      properties:
        id:
          $ref: "common.schema.yaml#/definitions/entityId"
        action:
          type: string
          minLength: 1
        component:
          allOf:
            - $ref: "common.schema.yaml#/definitions/entityId"
            - x-foreign-key:
                entity_type: component
        parameter:
          type: string
          pattern: "^[a-z][a-z0-9-]{2,63}$"
        notes:
          type: [string, "null"]
      required: [id, action]
      additionalProperties: false
  evidence:
    $ref: "common.schema.yaml#/definitions/evidenceMap"
required: [name, steps, evidence]
unevaluatedProperties: false
